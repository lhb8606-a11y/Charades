<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>몸으로 말해요</title>
    <style>
        /* 기본 배경 및 폰트 설정 (어두운 배경) */
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 화면 전환용 클래스 */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            position: relative;
        }
        .active { display: flex; }

        /* 타이틀 화면 */
        .title {
            font-size: 6vw;
            font-weight: bold;
            color: #FFD166;
            text-shadow: 2px 2px 10px rgba(255, 209, 102, 0.5);
            animation: pulse 2s infinite;
        }
        @media (max-width: 768px) { .title { font-size: 12vw; } }

        .click-guide {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #aaa;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
        }

        /* 룰렛 화면 전용 */
        #selected-category-display {
            font-size: 2.5rem;
            font-weight: bold;
            min-height: 3.5rem;
            margin-bottom: 20px;
            color: #fff;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s;
        }
        #selected-category-display.pop {
            transform: scale(1.3);
            color: #06D6A0;
            text-shadow: 0 0 15px rgba(6, 214, 160, 0.8);
        }

        .roulette-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
            border-radius: 50%;
            border: 6px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid #EF476F;
            z-index: 10;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        .wheel-segment-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            white-space: nowrap;
        }

        /* 게임 화면 */
        .game-image { max-width: 300px; max-height: 300px; margin-bottom: 30px; object-fit: contain; }
        .game-emoji { font-size: 150px; margin-bottom: 20px; line-height: 1; }
        .game-word { 
            font-size: 3.5rem; 
            font-weight: bold; 
            word-break: keep-all; 
            padding: 0 30px;
            line-height: 1.3;
            max-width: 90%;
        }
        .game-counter { position: absolute; top: 30px; right: 30px; font-size: 1.5rem; color: #aaa; font-weight: bold; }
        
        .instruction { position: absolute; bottom: 50px; font-size: 1rem; color: #666; }
        
        /* 저작권 문구 */
        .copyright {
            position: absolute;
            bottom: 15px;
            font-size: 11px;
            color: #ffffff;
            opacity: 0.5;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="screen active">
        <div class="title">몸으로 말해요</div>
        <div class="click-guide">화면을 클릭(터치)하거나 스페이스바를 누르세요</div>
        <div class="copyright">저작권은 Builder sound 에 있습니다</div>
    </div>

    <!-- 2. 룰렛 장르 선택 화면 -->
    <div id="roulette-screen" class="screen">
        <div id="selected-category-display">장르를 선택하세요</div>
        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <!-- 자바스크립트로 7개 장르가 생성됩니다 -->
            </div>
        </div>
        <div class="click-guide" id="roulette-guide">클릭(스페이스)하여 룰렛 돌리기</div>
        <div class="copyright">저작권은 Builder sound 에 있습니다</div>
    </div>

    <!-- 3. 게임 화면 -->
    <div id="game-screen" class="screen">
        <div class="game-counter" id="game-counter">1 / 10</div>
        
        <img id="item-image" class="game-image" src="" alt="게임 이미지" style="display: none;">
        <div id="item-emoji" class="game-emoji" style="display: none;"></div>
        <div class="game-word" id="item-word">제시어</div>
        
        <div class="instruction">클릭 / 터치 / 스페이스바 : 다음 문제</div>
    </div>

    <!-- 4. 종료 화면 -->
    <div id="end-screen" class="screen">
        <div class="title" style="animation: none;">게임 끝!</div>
        <div class="click-guide">클릭하여 메인으로 돌아가기</div>
        <div class="copyright">저작권은 Builder sound 에 있습니다</div>
    </div>

            appState = 'ROULETTE_STOPPED';
            selectedGameCategory = categories[targetIndex].id;
            
            const display = document.getElementById('selected-category-display');
            display.innerText = categories[targetIndex].name;
            display.classList.add('pop');
            
            document.getElementById('roulette-guide').innerText = "화면을 클릭하면 게임이 시작됩니다!";
        }, 3500);
    }

    // 랜덤 셔플 함수
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 실제 게임 시작 (데이터 로딩)
    function startActualGame() {
        appState = 'GAME';
        let db = [];
        if(selectedGameCategory === 'pokemon') db = dbPokemon;
        if(selectedGameCategory === 'mart') db = dbMart;
        if(selectedGameCategory === 'animal') db = dbAnimal;
        if(selectedGameCategory === 'proverb') db = dbProverb;
        if(selectedGameCategory === 'job') db = dbJob;
        if(selectedGameCategory === 'sport') db = dbSport;
        if(selectedGameCategory === 'emotion') db = dbEmotion;

        currentSequence = shuffle([...db]).slice(0, 10);
        currentIndex = 0;
        
        updateGameView();
        showScreen('game-screen');
    }

    // 게임 화면 업데이트
    function updateGameView() {
        const itemImage = document.getElementById('item-image');
        const itemEmoji = document.getElementById('item-emoji');
        const itemWord = document.getElementById('item-word');
        const counter = document.getElementById('game-counter');

        counter.innerText = `${currentIndex + 1} / 10`;
        const currentItem = currentSequence[currentIndex];
        itemWord.innerText = currentItem.word;

        if (currentItem.type === 'image') {
            itemImage.src = currentItem.src;
            itemImage.style.display = 'block';
            itemEmoji.style.display = 'none';
        } else if (currentItem.type === 'emoji') {
            itemEmoji.innerText = currentItem.emoji;
            itemEmoji.style.display = 'block';
            itemImage.style.display = 'none';
        } else {
            // text 타입 (속담, 직업, 스포츠, 감정 등)
            itemImage.style.display = 'none';
            itemEmoji.style.display = 'none';
        }
    }

    // 다음 문제로
    function nextGameItem() {
        currentIndex++;
        if (currentIndex >= 10) {
            appState = 'END';
            showScreen('end-screen');
        } else {
            updateGameView();
        }
    }

</script>
</body>
</html>
