<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>몸으로 말해요</title>
    <style>
        /* 기본 배경 및 폰트 설정 (어두운 배경) */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 각 화면(Screen) 전환용 클래스 */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        .active { display: flex; }

        /* 제목 화면 */
        .title {
            font-size: 5vw;
            font-weight: bold;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        @media (max-width: 768px) { .title { font-size: 10vw; } }

        .click-guide {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #888;
        }

        /* 저작권 문구 */
        .copyright {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            color: #ffffff;
            opacity: 0.7;
        }

        /* 장르 선택 화면 */
        .category-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
        }
        .btn-category {
            background-color: #333;
            color: white;
            border: 2px solid #555;
            padding: 20px 40px;
            font-size: 1.5rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            width: 250px;
        }
        .btn-category:hover { background-color: #505050; border-color: #777; transform: scale(1.05); }

        /* 게임 화면 */
        #game-screen { cursor: pointer; }
        .game-image { max-width: 300px; max-height: 300px; margin-bottom: 30px; object-fit: contain; }
        .game-emoji { font-size: 150px; margin-bottom: 20px; line-height: 1; }
        .game-word { font-size: 4rem; font-weight: bold; word-break: keep-all; padding: 0 20px; }
        .game-counter { position: absolute; top: 20px; right: 30px; font-size: 1.5rem; color: #aaa; }
        
        .instruction { position: absolute; bottom: 50px; font-size: 1rem; color: #666; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="screen active" onclick="showScreen('category-screen')">
        <div class="title">몸으로 말해요</div>
        <div class="click-guide">화면을 클릭(터치)하거나 스페이스바를 누르세요</div>
        <div class="copyright">저작권은 Builder sound 에 있습니다</div>
    </div>

    <!-- 2. 장르 선택 화면 -->
    <div id="category-screen" class="screen">
        <h2 style="font-size: 2.5rem; margin-bottom: 40px;">장르를 선택하세요</h2>
        <div class="category-container">
            <button class="btn-category" onclick="startGame('pokemon')">포켓몬스터 1세대</button>
            <button class="btn-category" onclick="startGame('mart')">마트 물건</button>
            <button class="btn-category" onclick="startGame('animal')">동물</button>
            <button class="btn-category" onclick="startGame('proverb')">속담</button>
        </div>
        <div class="copyright">저작권은 Builder sound 에 있습니다</div>
    </div>

    <!-- 3. 게임 화면 -->
    <div id="game-screen" class="screen">
        <div class="game-counter" id="game-counter">1 / 10</div>
        
        <!-- 이미지가 들어갈 공간 -->
        <img id="item-image" class="game-image" src="" alt="게임 이미지" style="display: none;">
        <div id="item-emoji" class="game-emoji" style="display: none;"></div>
        
        <!-- 제시어 -->
        <div class="game-word" id="item-word">제시어</div>
        
        <div class="instruction">화면 클릭 / 터치 / 스페이스바를 누르면 다음으로 넘어갑니다.</div>
    </div>

    <!-- 4. 종료 화면 -->
    <div id="end-screen" class="screen" onclick="showScreen('category-screen')">
        <div class="title" style="animation: none;">게임 끝!</div>
        <div class="click-guide">클릭하여 장르 선택으로 돌아가기</div>
    </div>

    // -----------------------------------------------------

    let currentSequence = [];

    let currentScreenId = 'title-screen';

    // 화면 전환 함수
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        currentScreenId = screenId;
    }

    // 배열을 랜덤으로 섞어주는 함수
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    // 게임 시작 함수
    function startGame(category) {
        let db = [];
        if(category === 'pokemon') db = dbPokemon;
        if(category === 'mart') db = dbMart;
        if(category === 'animal') db = dbAnimal;
        if(category === 'proverb') db = dbProverb;

        // 랜덤으로 섞은 뒤 10개 추출
        currentSequence = shuffle([...db]).slice(0, 10);
        currentIndex = 0;
        
        updateGameView();
        showScreen('game-screen');
    }

    // 게임 화면 업데이트
    function updateGameView() {
        const itemImage = document.getElementById('item-image');
        const itemEmoji = document.getElementById('item-emoji');
        const itemWord = document.getElementById('item-word');
        const counter = document.getElementById('game-counter');

        counter.innerText = `${currentIndex + 1} / 10`;

        const currentItem = currentSequence[currentIndex];
        itemWord.innerText = currentItem.word;

        // 표시 타입(이미지, 이모지, 텍스트(속담))에 따른 처리
        if (currentItem.type === 'image') {
            itemImage.src = currentItem.src;
            itemImage.style.display = 'block';
            itemEmoji.style.display = 'none';
        } else if (currentItem.type === 'emoji') {
            itemEmoji.innerText = currentItem.emoji;
            itemEmoji.style.display = 'block';
            itemImage.style.display = 'none';
        } else {
            itemImage.style.display = 'none';
            itemEmoji.style.display = 'none';
        }
    }

    // 다음 문제로 넘어가기
    function nextItem() {
        if (currentScreenId !== 'game-screen') return;

        currentIndex++;
        if (currentIndex >= 10) {
            showScreen('end-screen');
        } else {
            updateGameView();
        }
    }

    // -----------------------------------------------------
    // 3. 조작(컨트롤) 이벤트 등록
    // -----------------------------------------------------
    
    // 클릭 및 터치 이벤트
    document.getElementById('game-screen').addEventListener('click', nextItem);
    
    // 모바일 터치 민감도를 위해 touchstart 추가
    document.getElementById('game-screen').addEventListener('touchstart', (e) => {
        e.preventDefault(); // 더블 클릭 방지
        nextItem();
    }, {passive: false});

    // 스페이스바 조작
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault(); // 스페이스바로 화면 내려가는 것 방지
            
            // 타이틀이나 종료 화면일 때 스페이스 누르면 장르 선택화면으로
            if (currentScreenId === 'title-screen' || currentScreenId === 'end-screen') {
                showScreen('category-screen');
            } 
            // 게임 중이면 다음으로 넘어가기
            else if (currentScreenId === 'game-screen') {
                nextItem();
            }
        }
    });

</script>
</body>
</html>
